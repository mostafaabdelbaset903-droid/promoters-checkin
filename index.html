<!--
=== SUPABASE SETUP (SQL editor) ===
-- New table:
create table if not exists check_ins (
  id bigint generated always as identity primary key,
  client_id uuid unique, promoter_id text, promoter_name text,
  branch_id text, branch_name text, action_type text,
  timestamp timestamptz, captured_at timestamptz, work_date date,
  latitude double precision, longitude double precision,
  accuracy_m real, distance_m real, inside_geofence boolean,
  ip_address text, ip_country text, ip_city text,
  risk_score int, flags text, photo text,
  was_offline boolean, device_info text,
  synced_at timestamptz default now());
-- Already have a table? Add the missing columns:
alter table check_ins
  add column if not exists client_id uuid unique, add column if not exists promoter_id text,
  add column if not exists promoter_name text, add column if not exists branch_id text,
  add column if not exists branch_name text, add column if not exists captured_at timestamptz,
  add column if not exists work_date date, add column if not exists accuracy_m real,
  add column if not exists distance_m real, add column if not exists inside_geofence boolean,
  add column if not exists ip_country text, add column if not exists ip_city text,
  add column if not exists risk_score int, add column if not exists flags text,
  add column if not exists was_offline boolean, add column if not exists device_info text,
  add column if not exists photo text;
-- Security: anon may only INSERT
alter table check_ins enable row level security;
drop policy if exists "anon insert" on check_ins;
create policy "anon insert" on check_ins for insert to anon with check (true);
-->
<style>

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(165,0,52,.45)}100%{box-shadow:0 0 0 14px rgba(165,0,52,0)}}
.pulse{animation:pulse 1.8s infinite}
.fade{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}

<div class="app">

<script>
/* ===================== CONFIG — EDIT HERE ===================== */
const CFG = {
  SUPABASE_URL: 'https://rcfozjwtotnofpgbczta.supabase.co',
  SUPABASE_KEY: 'sb_publishable_6nrRGFTuwJRe9G1feWz1DA_cZffN_yw',
  TABLE: 'check_ins',
  MAX_ACCURACY_M: 80,      // reject GPS fixes worse than this
  BLOCK_RISK: 70,          // block submission at/above this risk score
  GPS_SAMPLE_MS: 6000,     // sampling window
  QUEUE_MAX: 500,
  ENFORCE_GEOFENCE: true,
  // Replace lat/lng with the real branch coordinates (right-click in Google Maps). radius in meters.
  BRANCHES: [
    {id:'almaza',  name:'City Centre Almaza',  lat:30.081462, lng:31.365003, radius:10000, cc:'EG'},
    {id:'btech1',  name:'B.TECH',              lat:30.081462, lng:31.365003, radius:10000, cc:'EG'},
    {id:'sharaf1', name:'Sharaf DG',           lat:30.081462, lng:31.365003, radius:10000, cc:'EG'}
  ]
};

/* ===================== I18N ===================== */
const I18N = {
 ar:{dir:'rtl',loc:'ar-EG',toggle:'English',appName:'تطبيق المروّجين',tagline:'Life\'s Good',pName:'الاسم',pId:'الرقم الوظيفي',branch:'الفرع',
  checkIn:'تسجيل حضور',checkOut:'تسجيل انصراف',pending:'سجل بانتظار المزامنة',sync:'مزامنة',offline:'لا يوجد اتصال — سيتم الحفظ على الجهاز',
  secNote:'يتم التحقق من الموقع وعنوان الشبكة',submit:'تسجيل وإرسال',
  inTitle:'تسجيل حضور',outTitle:'تسجيل انصراف',last:'آخر عملية',none:'لا توجد عمليات',
  cGps:'الموقع (GPS)',cIp:'عنوان IP',cGeo:'نطاق الفرع',
  wait:'جاري الفحص…',ok:'تم',bad:'فشل',denied:'مرفوض',inside:'داخل النطاق',outside:'خارج النطاق',skip:'غير مُعرّف',
  acc:'الدقة',busyCap:'جاري المعالجة…',busySync:'جاري المزامنة…',
  tIn:'تم تسجيل الحضور ✓',tOut:'تم تسجيل الانصراف ✓',tQueued:'تم الحفظ محلياً وسيُرفع تلقائياً',tSynced:'تمت مزامنة السجلات ✓',
  tErr:'تعذر الحفظ، حاول مرة أخرى',tProfile:'أدخل الاسم والرقم الوظيفي',tFull:'ذاكرة الأوفلاين ممتلئة — اتصل بالإنترنت للمزامنة',
  tOutside:'أنت خارج نطاق الفرع المحدد',tRisk:'تم رفض الموقع (مشتبه به)',tAcc:'دقة GPS ضعيفة، انتظر قليلاً',
  tOnline:'عاد الاتصال بالإنترنت',tOffline:'انقطع الاتصال',tDemo:'وضع تجريبي: أضف بيانات Supabase في الإعدادات'},
 en:{dir:'ltr',loc:'en-GB',toggle:'عربي',appName:'Promoter App',tagline:'Life\'s Good',pName:'Name',pId:'Employee ID',branch:'Branch',
  checkIn:'Check-In',checkOut:'Check-Out',pending:'record(s) waiting to sync',sync:'Sync',offline:'Offline — records are saved on this device',
  secNote:'Location and network address are verified',submit:'Record & Submit',
  inTitle:'Check-In',outTitle:'Check-Out',last:'Last',none:'No activity yet',
  cGps:'Location (GPS)',cIp:'IP Address',cGeo:'Branch geofence',
  wait:'Checking…',ok:'OK',bad:'Failed',denied:'Denied',inside:'Inside',outside:'Outside',skip:'Not set',
  acc:'Accuracy',busyCap:'Processing…',busySync:'Syncing…',
  tIn:'Check-In recorded ✓',tOut:'Check-Out recorded ✓',tQueued:'Saved offline — will upload automatically',tSynced:'Records synced ✓',
  tErr:'Could not save, please retry',tProfile:'Enter your name and employee ID',tFull:'Offline storage full — connect to sync',
  tOutside:'You are outside the selected branch',tRisk:'Location rejected (suspicious)',tAcc:'Weak GPS accuracy, wait a moment',
  tOnline:'Back online',tOffline:'Connection lost',tDemo:'Demo mode: add Supabase credentials in CONFIG'}
};
const $=id=>document.getElementById(id);
let lang=localStorage.lg_lang||'ar', S={type:null,map:null,mk:null,circ:null,gps:null,ip:null,checks:{}};
const T=k=>I18N[lang][k]||k;

function applyLang(){
  const L=I18N[lang]; document.documentElement.lang=lang; document.documentElement.dir=L.dir;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));
  $('langBtn').textContent=L.toggle; $('sheetTitle').textContent=S.type==='check_out'?T('outTitle'):T('inTitle');
  renderChecks(); renderLast(); tick(); localStorage.lg_lang=lang;
  if(S.map)setTimeout(()=>S.map.invalidateSize(),350);
}
function toggleLang(){lang=lang==='ar'?'en':'ar';applyLang()}
$('langBtn').onclick=toggleLang;

/* ===================== CLOCK ===================== */
function tick(){
  const l=I18N[lang].loc,d=new Date();
  $('clock').textContent=d.toLocaleTimeString(l,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  $('date').textContent=d.toLocaleDateString(l,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tick,1000);

/* ===================== TOASTS ===================== */
function toast(key,type='ok'){
  const bg={ok:'#16a34a',err:'#dc2626',warn:'#d97706',info:'#2B2B2B'}[type],ic={ok:'✓',err:'✕',warn:'!',info:'i'}[type];
  const el=document.createElement('div');el.className='toast';el.style.background=bg;
  el.innerHTML=`<span style="margin-inline-end:8px;font-weight:900">${ic}</span>`+T(key);
  $('toasts').appendChild(el);setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},3200);
}
function busy(on,key){const b=$('busy');b.classList.toggle('hidden',!on);b.classList.toggle('flex',on);if(key)$('busyTxt').textContent=T(key)}

/* ===================== SUPABASE ===================== */
const CONFIGURED=CFG.SUPABASE_URL.includes('supabase.co');
const sb=CONFIGURED?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY,{auth:{persistSession:false}}):null;

/* ===================== PROFILE / UI INIT ===================== */
const sel=$('branch');CFG.BRANCHES.forEach(b=>sel.add(new Option(b.name,b.id)));
['pName','pId'].forEach(k=>{$(k).value=localStorage['lg_'+k]||'';$(k).oninput=e=>localStorage['lg_'+k]=e.target.value.trim()});
sel.value=localStorage.lg_branch||CFG.BRANCHES[0].id;sel.onchange=()=>localStorage.lg_branch=sel.value;
const branch=()=>CFG.BRANCHES.find(b=>b.id===sel.value);
function renderLast(){const l=JSON.parse(localStorage.lg_last||'null');
  $('lastAct').textContent=l?`${T('last')}: ${l.type==='check_in'?T('checkIn'):T('checkOut')} · ${new Date(l.t).toLocaleTimeString(I18N[lang].loc,{hour:'2-digit',minute:'2-digit'})}`:T('none')}

/* ===================== NETWORK / IP ===================== */
async function fetchIP(){
  try{const r=await fetch('https://ipwho.is/',{cache:'no-store'});const d=await r.json();
    if(d.success===false)throw 0;S.ip={ip:d.ip,cc:d.country_code,city:d.city,lat:d.latitude,lng:d.longitude};
  }catch{try{const r=await fetch('https://api.ipify.org?format=json');S.ip={ip:(await r.json()).ip}}catch{S.ip=null}}
  $('ipHome').textContent=S.ip?S.ip.ip:'—';
  if(S.type)setCheck('ip',S.ip?'ok':'warn',S.ip?(S.ip.ip+(S.ip.cc?' · '+S.ip.cc:'')):'bad');
}
function setOnline(){const on=navigator.onLine;$('offbar').classList.toggle('hidden',on)}
addEventListener('online',()=>{setOnline();toast('tOnline','ok');fetchIP();syncQueue()});
addEventListener('offline',()=>{setOnline();toast('tOffline','warn')});

/* ===================== CHECKLIST ===================== */
const CH=['gps','ip','geo'],CHK={gps:'cGps',ip:'cIp',geo:'cGeo'};
function setCheck(id,st,txt){S.checks[id]={st,txt};renderChecks();gate()}
function renderChecks(){
  $('checks').innerHTML=CH.map(id=>{const c=S.checks[id]||{st:'load',txt:'wait'};
    const i=c.st==='load'?'<i class="spin"></i>':c.st==='ok'?'<b class="text-green-600">✓</b>':c.st==='warn'?'<b class="text-amber-500">!</b>':'<b class="text-red-600">✕</b>';
    return `<li class="flex items-center justify-between fade"><span class="text-gray-700">${T(CHK[id])}</span><span class="flex items-center gap-2 text-xs ${c.st==='bad'?'text-red-600':'text-gray-500'}">${I18N[lang][c.txt]||c.txt} ${i}</span></li>`}).join('');
}
function gate(){const g=S.checks.geo,ok=S.gps&&S.checks.gps?.st==='ok'&&g&&g.st!=='bad';$('submit').disabled=!ok}

/* ===================== CAPTURE FLOW ===================== */
async function openCapture(type){
  const name=$('pName').value.trim(),id=$('pId').value.trim();
  if(!name||!id)return toast('tProfile','warn');
  S.type=type;S.gps=null;S.checks={};$('coords').textContent='--';$('distTxt').textContent='';
  $('sheetTitle').textContent=type==='check_out'?T('outTitle'):T('inTitle');
  $('sheet').classList.add('open');renderChecks();gate();
  if(S.ip)setCheck('ip','ok',S.ip.ip+(S.ip.cc?' · '+S.ip.cc:'')); else {fetchIP()}
  setTimeout(startGPS,350);
}
function closeCapture(){S.type=null;$('sheet').classList.remove('open')}
/* ---------- Anti-fake GPS ---------- */
const rad=x=>x*Math.PI/180;
function dist(a,b,c,d){const R=6371000,dl=rad(c-a),dn=rad(d-b),x=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function sampleGPS(ms){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej('nogeo');const s=[];let done=false;
  const fin=()=>{if(done)return;done=true;navigator.geolocation.clearWatch(w);s.length?res(s):rej('timeout')};
  const w=navigator.geolocation.watchPosition(p=>s.push(p),e=>{if(!s.length&&!done){done=true;navigator.geolocation.clearWatch(w);rej(e.code)}},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  setTimeout(fin,ms);
})}
function analyse(samples,br){
  const best=samples.reduce((a,b)=>b.coords.accuracy<a.coords.accuracy?b:a),c=best.coords;let risk=0,flags=[];
  if(c.accuracy<=1){risk+=50;flags.push('PERFECT_ACC')}
  if(samples.length>=4&&new Set(samples.map(p=>p.coords.latitude+','+p.coords.longitude)).size===1){risk+=40;flags.push('STATIC_COORDS')}
  if(Math.abs(best.timestamp-Date.now())>60000){risk+=30;flags.push('TIME_DRIFT')}
  if(navigator.webdriver){risk+=50;flags.push('WEBDRIVER')}
  if(S.ip?.cc&&br.cc&&S.ip.cc!==br.cc){risk+=40;flags.push('IP_COUNTRY_MISMATCH')}
  if(S.ip?.lat!=null&&dist(c.latitude,c.longitude,S.ip.lat,S.ip.lng)>400000){risk+=30;flags.push('IP_GPS_FAR')}
  let d=null,inside=null;
  if(br.lat!=null){d=dist(c.latitude,c.longitude,br.lat,br.lng);inside=d<=br.radius+Math.min(c.accuracy,40)}else flags.push('NO_GEOFENCE');
  if(inside===false)flags.push('OUTSIDE_GEOFENCE');
  return{lat:c.latitude,lng:c.longitude,acc:c.accuracy,risk,flags,d,inside,t:Date.now()};
}
async function startGPS(){
  setCheck('gps','load','wait');setCheck('geo','load','wait');
  if(!S.map){S.map=L.map('map',{zoomControl:false}).setView([30.05,31.25],14);
    S.map.attributionControl.setPrefix(false);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(S.map)}
  $('map').classList.add('on');setTimeout(()=>S.map.invalidateSize(),450);
  const br=branch();
  try{
    const g=analyse(await sampleGPS(CFG.GPS_SAMPLE_MS),br);S.gps=g;
    $('coords').textContent=`${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}  ±${Math.round(g.acc)}m`;
    S.map.flyTo([g.lat,g.lng],17,{duration:1});
    S.mk&&S.map.removeLayer(S.mk);S.mk=L.circleMarker([g.lat,g.lng],{radius:8,color:'#fff',weight:3,fillColor:'#A50034',fillOpacity:1}).addTo(S.map);
    S.circ&&S.map.removeLayer(S.circ);if(br.lat!=null)S.circ=L.circle([br.lat,br.lng],{radius:br.radius,color:'#A50034',weight:2,fillOpacity:.08}).addTo(S.map);
    if(g.acc>CFG.MAX_ACCURACY_M){setCheck('gps','bad',`${T('acc')} ±${Math.round(g.acc)}m`);toast('tAcc','warn');S.gps=null}
    else setCheck('gps',g.risk>=CFG.BLOCK_RISK?'bad':'ok',g.risk>=CFG.BLOCK_RISK?'bad':`±${Math.round(g.acc)}m`);
    if(g.inside===null)setCheck('geo','warn','skip');
    else{$('distTxt').textContent=Math.round(g.d)+' m';setCheck('geo',g.inside?'ok':'bad',g.inside?'inside':'outside')}
    if(g.risk>=CFG.BLOCK_RISK){S.gps=null;toast('tRisk','err')}
  }catch{setCheck('gps','bad','denied');setCheck('geo','bad','bad')}
}

/* ===================== QUEUE / SYNC ===================== */
const getQ=()=>{try{return JSON.parse(localStorage.lg_queue||'[]')}catch{return[]}};
function setQ(q){try{localStorage.lg_queue=JSON.stringify(q);renderPending();return true}catch{return false}}
function renderPending(){const n=getQ().length;$('pending').classList.toggle('hidden',!n);$('pendN').textContent=n}
async function sendRecord(r,wasOffline){
  if(!sb)throw new Error('demo');
  // Full record in one insert
  let {error}=await sb.from(CFG.TABLE).upsert({...r,was_offline:wasOffline},{onConflict:'client_id',ignoreDuplicates:true});
  // Fallback: table has only the basic columns -> insert the core fields
  if(error&&/column|schema cache|42703|42P10|PGRST20/i.test((error.code||'')+' '+(error.message||''))){
    console.warn('Extended insert failed, using core columns:',error);
    ({error}=await sb.from(CFG.TABLE).insert([{action_type:r.action_type,timestamp:r.captured_at,latitude:r.latitude,longitude:r.longitude,ip_address:r.ip_address}]));
  }
  if(error){console.error('Supabase error:',error);throw error}
}
let syncing=false;
async function syncQueue(manual){
  if(syncing||!navigator.onLine||!sb)return manual&&!sb&&toast('tDemo','warn');
  let q=getQ();if(!q.length)return;syncing=true;manual&&busy(true,'busySync');let sent=0;
  try{for(const r of [...q]){await sendRecord(r,true);q=q.filter(x=>x.client_id!==r.client_id);setQ(q);sent++}}
  catch(e){console.warn('sync',e);manual&&toast('tErr','err')}
  syncing=false;busy(false);if(sent)toast('tSynced','ok');
}
setInterval(()=>syncQueue(),30000);

/* ===================== SUBMIT ===================== */
async function submitRecord(){
  if(S.gps&&Date.now()-S.gps.t>90000){busy(true,'wait');await startGPS();busy(false)}
  const g=S.gps;if(!g)return toast('tRisk','err');
  if(CFG.ENFORCE_GEOFENCE&&g.inside===false)return toast('tOutside','err');
  busy(true,'busyCap');const b=branch(),now=new Date();
  const rec={client_id:crypto.randomUUID(),promoter_id:$('pId').value.trim(),promoter_name:$('pName').value.trim(),
    branch_id:b.id,branch_name:b.name,action_type:S.type,captured_at:now.toISOString(),
    work_date:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`,
    latitude:g.lat,longitude:g.lng,accuracy_m:Math.round(g.acc*10)/10,distance_m:g.d==null?null:Math.round(g.d),inside_geofence:g.inside,
    ip_address:S.ip?.ip||null,ip_country:S.ip?.cc||null,ip_city:S.ip?.city||null,risk_score:g.risk,flags:g.flags.join(',')||null,
    device_info:navigator.userAgent.slice(0,180)};
  let sent=false;
  if(navigator.onLine&&sb){try{await sendRecord(rec,false);sent=true}catch(e){console.warn('send failed, queueing',e)}}
  if(!sent){
    const q=getQ();
    if(q.length>=CFG.QUEUE_MAX||!(q.push(rec),setQ(q))){busy(false);return toast('tFull','err')}
    toast(sb?'tQueued':'tDemo','warn');
  }else toast(S.type==='check_in'?'tIn':'tOut','ok');
  localStorage.lg_last=JSON.stringify({type:S.type,t:Date.now()});renderLast();busy(false);closeCapture();
}

/* ===================== BOOT ===================== */
addEventListener('load',()=>{applyLang();setOnline();renderPending();fetchIP();syncQueue()});
</script>
